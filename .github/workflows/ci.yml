name: CI — Build & Test
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]


jobs:
  build-backend:
    name: Build & Test Spring Boot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build with Maven
        working-directory: ./RevPlay
        run: ./mvnw clean package -DskipTests

      - name: Run tests
        working-directory: ./RevPlay
        run: ./mvnw test

  build-frontend:
    name: Build Angular
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: revplay-frontend/package-lock.json       
      - name: Install dependencies
        working-directory: ./revplay-frontend
        run: npm ci

      - name: Build Angular app
        working-directory: ./revplay-frontend
        run: npm run build -- --configuration production

  docker-build-check:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3 
      - name: Build backend image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./RevPlay
          push: false
          tags: revplay-backend:ci

      - name: Build frontend image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./revplay-frontend
          push: false
          tags: revplay-frontend:ci        